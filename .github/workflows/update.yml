name: Update Steel News

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install packages
        run: |
          pip install requests beautifulsoup4

      - name: Collect news
        run: |
          cat > update_news.py <<'PY'
          import json
          import time
          import requests
          import xml.etree.ElementTree as ET
          from bs4 import BeautifulSoup
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from urllib.parse import urljoin

          RSS_URL = "https://news.google.com/rss/search?q=Australia+steel&hl=en-AU&gl=AU&ceid=AU:en"

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/131.0 Safari/537.36"
              )
          }

          def get_image(url):
              try:
                  response = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=20,
                      allow_redirects=True
                  )

                  final_url = response.url

                  soup = BeautifulSoup(response.text, "html.parser")

                  # 1. Open Graph image
                  tag = soup.find(
                      "meta",
                      attrs={"property": "og:image"}
                  )

                  if tag and tag.get("content"):
                      return urljoin(final_url, tag["content"])

                  # 2. Twitter image
                  tag = soup.find(
                      "meta",
                      attrs={"name": "twitter:image"}
                  )

                  if tag and tag.get("content"):
                      return urljoin(final_url, tag["content"])

                  # 3. Alternative Twitter card format
                  tag = soup.find(
                      "meta",
                      attrs={"property": "twitter:image"}
                  )

                  if tag and tag.get("content"):
                      return urljoin(final_url, tag["content"])

                  # 4. image_src
                  tag = soup.find(
                      "link",
                      attrs={"rel": "image_src"}
                  )

                  if tag and tag.get("href"):
                      return urljoin(final_url, tag["href"])

                  # 5. Look for a reasonably large article image
                  for img in soup.find_all("img"):

                      src = (
                          img.get("src")
                          or img.get("data-src")
                          or img.get("data-lazy-src")
                      )

                      if not src:
                          continue

                      width = img.get("width", "")
                      height = img.get("height", "")

                      try:
                          if width and int(width) < 250:
                              continue
                          if height and int(height) < 150:
                              continue
                      except:
                          pass

                      image_url = urljoin(final_url, src)

                      if image_url.startswith("http"):
                          return image_url

              except Exception as e:
                  print("Image error:", e)

              return ""

          # Download Google News RSS
          response = requests.get(
              RSS_URL,
              headers=HEADERS,
              timeout=30
          )

          response.raise_for_status()

          root = ET.fromstring(response.content)

          items = []

          for item in root.findall(".//item")[:20]:

              title = item.findtext("title", "").strip()
              link = item.findtext("link", "").strip()
              pub_date = item.findtext("pubDate", "").strip()

              source_element = item.find("source")

              if (
                  source_element is not None
                  and source_element.text
              ):
                  source = source_element.text.strip()
              else:
                  source = "Google News"

              print("")
              print("Processing:", title)
              print("Google News URL:", link)

              image = get_image(link)

              print("Image:", image)

              formatted_date = pub_date

              try:
                  dt = parsedate_to_datetime(pub_date)
                  formatted_date = dt.strftime("%d %b %Y")
              except:
                  pass

              items.append({
                  "title": title,
                  "link": link,
                  "source": source,
                  "date": formatted_date,
                  "image": image
              })

              time.sleep(1)

          data = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "items": items
          }

          with open(
              "feed.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("================================")
          print(f"Collected {len(items)} news articles.")
          print("================================")
          PY

          python update_news.py

      - name: Save updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update steel news feed"
            git push
          fi
